# ===================================================================
# Municipal Smart Public Beach Safety & Water Quality Monitoring System
# Application Configuration (MySQL Production / Workbench Mode)
# ===================================================================

server.port=8080
spring.application.name=municipal-beach-safety-pro

# -------------------------------------------------------------------
# MySQL Datasource Configuration
# -------------------------------------------------------------------
# Supports environment variable MYSQL_PASSWORD, defaults to 'root'
spring.datasource.url=jdbc:mysql://localhost:3306/beach_safety_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disable automatic SQL script runner; DataInitializer handles seeding via Spring Data JPA
spring.sql.init.mode=never

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.example.beachsafety=INFO
logging.level.org.springframework.web=INFO
